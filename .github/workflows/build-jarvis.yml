name: Jarvis APK

on:
  push:
    branches: [ jarvis ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK yig'ish
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Nomlash
        run: cp app/build/outputs/apk/release/app-release.apk Jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk

      - name: Release yaratish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "jarvis-v1.${{ github.run_number }}" Jarvis.apk \
            --prerelease \
            --target jarvis \
            --title "Jarvis v1.${{ github.run_number }}" \
            --notes "Jarvis — shaxsiy AI yordamchi. Telefonga yuklab oling va o'rnating."

      - name: Xato jurnalini saqlash
        if: failure()
        run: |
          tail -n 400 build.log > log.txt || echo "log yo'q" > log.txt
          git config user.name "jarvis-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan jarvis-log
          git rm -rfq --cached . || true
          git add -f log.txt
          git commit -qm "log ${{ github.run_number }}"
          git push -f origin jarvis-log
