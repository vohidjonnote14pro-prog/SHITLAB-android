plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.shitlab.app'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.shitlab.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // O'rnatish uchun debug kalit bilan imzolanadi (Play Market uchun alohida kalit kerak)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
