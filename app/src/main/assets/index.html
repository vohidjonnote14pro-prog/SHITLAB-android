<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chaqmoq</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.3;-webkit-user-select:none;user-select:none;transition:background .35s,color .35s}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none;padding:0;text-align:left}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
h1,h2,h3,p{margin:0}
svg{flex:none}

body[data-theme=pastel]{--bg:#FAFAFC;--surf:#EFF0F4;--card:#FFFFFF;--tx:#14161A;--sub:#5B616E;--line:#E4E7EC;--acc:#2F5BEA;--accfg:#FFFFFF;--link:#1E3FB0;
--navbg:#14161A;--navfg:#FFFFFF;--navon:#FFFFFF;--navonfg:#14161A;--plus:#FFD23F;--plusfg:#14161A;
--c1:#DCE6FF;--c2:#D5F0E8;--c3:#FBE0CF;--c4:#E4DBFB;--cfg:#14161A;--csub:#3A4152;
--i1:#2F5BEA;--i2:#0E7C66;--i3:#B4470E;--i4:#5B36C9;--ifg:#FFFFFF;
--calc:#14161A;--calc2:#23262D;--calcfg:#F2F4F7;--calcsub:#B6BDC9;--volt:#FFD23F;--voltfg:#14161A;--rad:30px;--red:#C62828}
body[data-theme=tungi]{--bg:#0F1115;--surf:#1A1D24;--card:#1A1D24;--tx:#F2F4F7;--sub:#9AA3B2;--line:#2A2E38;--acc:#C6F432;--accfg:#14161A;--link:#C6F432;
--navbg:#1A1D24;--navfg:#9AA3B2;--navon:#C6F432;--navonfg:#14161A;--plus:#F2F4F7;--plusfg:#14161A;
--c1:#2F5BEA;--c2:#0E7C66;--c3:#B4470E;--c4:#5B36C9;--cfg:#FFFFFF;--csub:#FFFFFF;
--i1:rgba(255,255,255,.18);--i2:rgba(255,255,255,.18);--i3:rgba(255,255,255,.18);--i4:rgba(255,255,255,.18);--ifg:#FFFFFF;
--calc:#1A1D24;--calc2:#262A33;--calcfg:#F2F4F7;--calcsub:#9AA3B2;--volt:#C6F432;--voltfg:#14161A;--rad:24px;--red:#FF8A80}
body[data-theme=mozaika]{--bg:#F4F5F7;--surf:#FFFFFF;--card:#FFFFFF;--tx:#14161A;--sub:#5B616E;--line:#E4E7EC;--acc:#14161A;--accfg:#FFFFFF;--link:#1E3FB0;
--navbg:#FFFFFF;--navfg:#5B616E;--navon:#14161A;--navonfg:#FFFFFF;--plus:#14161A;--plusfg:#FFFFFF;
--c1:#2F5BEA;--c2:#0E7C66;--c3:#B4470E;--c4:#5B36C9;--cfg:#FFFFFF;--csub:#FFFFFF;
--i1:rgba(255,255,255,.18);--i2:rgba(255,255,255,.18);--i3:rgba(255,255,255,.18);--i4:rgba(255,255,255,.18);--ifg:#FFFFFF;
--calc:#14161A;--calc2:#23262D;--calcfg:#F2F4F7;--calcsub:#B6BDC9;--volt:#FFD23F;--voltfg:#14161A;--rad:28px;--red:#C62828}

@keyframes pop{0%{opacity:0;transform:scale(.8)}70%{opacity:1;transform:scale(1.03)}100%{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fromL{from{opacity:0;transform:translateX(-50px)}to{opacity:1;transform:none}}
@keyframes fromR{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes ringfill{from{stroke-dashoffset:125.66}}
@keyframes fillw{from{width:0}}
@keyframes spark{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.2)}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-12px,12px) scale(1.14)}}
@keyframes spin{to{transform:rotate(360deg)}}
.pop{animation:pop .55s cubic-bezier(.2,.8,.2,1) both}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.press{transition:transform .16s cubic-bezier(.2,.8,.2,1)}
.press:active{transform:scale(.95)}

#app{position:absolute;inset:0;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 20px 120px;-webkit-overflow-scrolling:touch}
#view.fwd>.scr{animation:inR .32s cubic-bezier(.2,.8,.2,1) both}
#view.back>.scr{animation:inL .32s cubic-bezier(.2,.8,.2,1) both}
.scr{display:flex;flex-direction:column;gap:14px}

.hd{display:flex;align-items:center;gap:12px;min-height:52px}
.hd .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hd .sm{font-size:13px;font-weight:500;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd h1{font-size:30px;line-height:34px;font-weight:800;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd h1.s{font-size:24px;line-height:28px}
.ib{width:48px;height:48px;border-radius:16px;background:var(--surf);display:flex;align-items:center;justify-content:center;flex:none}
.ring{width:52px;height:52px;position:relative;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .v{animation:ringfill 1.2s cubic-bezier(.2,.8,.2,1) .3s both}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fc{position:relative;overflow:hidden;width:100%;height:150px;border-radius:var(--rad);padding:16px;display:flex;flex-direction:column;justify-content:space-between;color:var(--cfg)}
.fc .ic{width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--ifg)}
.fc b{display:block;font-size:20px;font-weight:800;letter-spacing:-.3px}
.fc span.n{font-size:13px;font-weight:500;color:var(--csub)}
.fc .blob{position:absolute;right:-28px;top:-28px;width:110px;height:110px;border-radius:55px;background:rgba(255,255,255,.14);animation:drift 7s ease-in-out infinite;display:none}
body[data-theme=tungi] .fc .blob,body[data-theme=mozaika] .fc .blob{display:block}
.k1{background:var(--c1)}.k2{background:var(--c2)}.k3{background:var(--c3)}.k4{background:var(--c4)}
.k1 .ic{background:var(--i1)}.k2 .ic{background:var(--i2)}.k3 .ic{background:var(--i3)}.k4 .ic{background:var(--i4)}
body[data-theme=mozaika] .grid.home .w1{grid-row:span 2}
body[data-theme=mozaika] .grid.home .w1 .fc{height:272px}
body[data-theme=mozaika] .grid.home .w2 .fc,body[data-theme=mozaika] .grid.home .w3 .fc{height:130px}
body[data-theme=mozaika] .grid.home .w4{grid-column:span 2}
body[data-theme=mozaika] .grid.home .w4 .fc{height:88px;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
body[data-theme=mozaika] .grid.home .w1{animation-name:fromL}
body[data-theme=mozaika] .grid.home .w2,body[data-theme=mozaika] .grid.home .w3{animation-name:fromR}
body[data-theme=mozaika] .grid.home .w4{animation-name:rise}

.wide{width:100%;border-radius:22px;background:var(--surf);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.wide .r{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wide b{font-size:15px;font-weight:700}
.wide .n{font-size:13px;color:var(--sub)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:10px;border-radius:5px;background:var(--acc);animation:fillw 1.1s cubic-bezier(.2,.8,.2,1) .3s both}

.sec{display:flex;justify-content:space-between;align-items:center;min-height:28px}
.sec h2{font-size:16px;font-weight:800}
.sec button{font-size:13px;font-weight:700;color:var(--link);min-height:44px;padding:0 4px}

.calc{background:var(--calc);color:var(--calcfg);border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:10px}
.calc .top{display:flex;justify-content:space-between;align-items:center}
.calc h2{font-size:18px;font-weight:800}
.calc .spark{animation:spark 1.8s ease-in-out infinite;color:var(--volt)}
.calc .inp{height:60px;border-radius:18px;background:var(--calc2);padding:0 16px;display:flex;align-items:center;gap:10px}
.calc .inp span{font-size:13px;font-weight:600;color:var(--calcsub)}
.calc .inp input{flex:1;min-width:0;background:none;border:0;outline:0;color:#FFFFFF;font-size:28px;font-weight:800;text-align:right}
.calc .inp em{font-style:normal;font-size:20px;font-weight:800;color:var(--volt)}
.row{display:flex;gap:8px;align-items:center}
.row .lb{flex:1;font-size:13px;font-weight:600;color:var(--calcsub)}
.ch{height:44px;border-radius:14px;padding:0 14px;background:var(--calc2);color:var(--calcfg);font-size:14px;font-weight:700;text-align:center;transition:background .25s,color .25s,transform .16s}
.ch.f{flex:1}
.ch.on{background:var(--volt);color:var(--voltfg)}
.ch:active{transform:scale(.95)}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.res div{height:78px;border-radius:18px;background:var(--calc2);padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.res div span{font-size:12px;font-weight:700;color:var(--calcsub)}
.res div b{font-size:21px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res div.main{background:var(--volt);color:var(--voltfg)}
.res div.main span{color:var(--voltfg)}
.calc .fx{font-size:12px;color:var(--calcsub);min-height:16px}

.notes2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.nt{width:100%;min-height:112px;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surf);color:var(--tx);position:relative}
.nt b{font-size:15px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nt p{font-size:13px;line-height:17px;opacity:.82;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.nt small{font-size:12px;font-weight:600;opacity:.8}
.nt.big p{-webkit-line-clamp:6}
.nt.c1{background:#FFF3C4;color:#14161A}.nt.c2{background:#DDF2EC;color:#14161A}.nt.c3{background:#E3EAFD;color:#14161A}.nt.c4{background:#FBE5D8;color:#14161A}
.nt .pin{position:absolute;right:12px;top:12px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;background:rgba(20,22,26,.12)}
.empty{border-radius:22px;background:var(--surf);padding:22px 16px;text-align:center;color:var(--sub);font-size:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.btn{min-height:48px;border-radius:16px;padding:0 18px;background:var(--acc);color:var(--accfg);font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.g{background:var(--surf);color:var(--tx)}
.btn.d{background:#C62828;color:#FFFFFF}

.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tl{height:96px;border-radius:22px;background:var(--surf);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;text-align:center}
.tl small{font-size:11px;font-weight:600;color:var(--sub)}

.search{height:50px;border-radius:16px;background:var(--surf);padding:0 14px;display:flex;align-items:center;gap:10px;color:var(--sub)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font-size:15px}
.fold{width:100%;height:112px;border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;background:var(--c1);color:var(--cfg);position:relative}
.fold b{font-size:15px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold span{font-size:12px;font-weight:500;color:var(--csub)}
.fold .fi{color:var(--i1)}
body[data-theme=tungi] .fold .fi,body[data-theme=mozaika] .fold .fi{color:#FFFFFF}
.list{display:flex;flex-direction:column;gap:8px}
.fr{width:100%;min-height:64px;border-radius:18px;background:var(--surf);padding:8px 6px 8px 12px;display:flex;align-items:center;gap:12px}
.fr .bd{width:44px;height:44px;border-radius:13px;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;background:var(--line);color:var(--tx)}
.fr .bd.w{background:#E3EAFD;color:#1E3FB0}.fr .bd.x{background:#DDF2EC;color:#0A5C4B}.fr .bd.p{background:#FBE5D8;color:#8A3409}.fr .bd.i{background:#D5F0E8;color:#0A5C4B}.fr .bd.v{background:#E4DBFB;color:#3F2496}.fr .bd.a{background:#FFF3C4;color:#5A4A00}
.fr .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fr .tx b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .tx span{font-size:12px;color:var(--sub)}
.more{width:44px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none}
.fold .more{position:absolute;right:4px;top:6px;color:inherit}
.clip{position:fixed;left:20px;right:20px;bottom:104px;border-radius:20px;background:var(--calc);color:#FFFFFF;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:8px;animation:rise .35s both;z-index:5;box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}
.clip span{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip button{min-height:44px;border-radius:14px;padding:0 14px;font-size:13px;font-weight:800;background:var(--volt);color:var(--voltfg)}
.clip button.x{background:#33373F;color:#FFFFFF}

#nav{position:fixed;left:20px;right:20px;bottom:18px;height:68px;border-radius:26px;background:var(--navbg);color:var(--navfg);display:flex;align-items:center;justify-content:space-between;padding:0 10px;box-shadow:0 16px 30px -14px rgba(0,0,0,.45);z-index:6;transition:transform .35s cubic-bezier(.2,.8,.2,1),background .35s}
#nav.hide{transform:translateY(120px)}
body[data-theme=pastel] #nav{color:#FFFFFF}
.tab{height:48px;border-radius:16px;padding:0 12px;display:flex;align-items:center;gap:8px;transition:background .3s,color .3s}
.tab .lbl{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-size:13px;font-weight:700;transition:max-width .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
.tab.on{background:var(--navon);color:var(--navonfg)}
.tab.on .lbl{max-width:90px;opacity:1}
.plus{width:50px;height:50px;border-radius:18px;background:var(--plus);color:var(--plusfg);display:flex;align-items:center;justify-content:center}

#ov{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:20;display:none;align-items:flex-end;animation:fade .2s both}
#ov.on{display:flex}
#ov.mid{align-items:center;justify-content:center;padding:24px}
.sh{width:100%;background:var(--bg);color:var(--tx);border-radius:28px 28px 0 0;padding:10px 16px 22px;animation:sheet .32s cubic-bezier(.2,.8,.2,1) both;max-height:86%;overflow-y:auto}
.sh .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sh h3{font-size:17px;font-weight:800;padding:2px 6px 10px;word-break:break-word}
.sh .it{width:100%;min-height:54px;border-radius:16px;padding:0 12px;display:flex;align-items:center;gap:14px;font-size:15px;font-weight:600}
.sh .it:active{background:var(--surf)}
.sh .it.red{color:#C62828}
body[data-theme=tungi] .sh .it.red{color:#FF8A80}
.dlg{width:100%;max-width:420px;background:var(--bg);color:var(--tx);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:14px;animation:pop .3s both}
.dlg h3{font-size:18px;font-weight:800}
.dlg p{font-size:14px;color:var(--sub);word-break:break-word}
.dlg input{height:54px;border-radius:16px;border:2px solid var(--line);background:var(--surf);padding:0 14px;font-size:16px;outline:0;width:100%}
.dlg input:focus{border-color:var(--acc)}
.dlg .bs{display:flex;gap:10px}
.dlg .bs .btn{flex:1}
#toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,30px);background:#14161A;color:#FFFFFF;font-size:14px;font-weight:600;padding:12px 18px;border-radius:16px;opacity:0;transition:opacity .25s,transform .25s;z-index:30;max-width:86%;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.spin{width:22px;height:22px;border-radius:11px;border:3px solid rgba(255,255,255,.3);border-top-color:#FFFFFF;animation:spin .8s linear infinite}

.ed{display:flex;flex-direction:column;gap:12px}
.ed input.t{height:56px;border-radius:18px;border:0;background:var(--surf);padding:0 16px;font-size:20px;font-weight:800;outline:0;width:100%}
.ed textarea{min-height:300px;border-radius:18px;border:0;background:var(--surf);padding:14px 16px;font-size:16px;line-height:24px;outline:0;width:100%;resize:none}
.cols{display:flex;gap:10px;align-items:center}
.col{width:44px;height:44px;border-radius:14px;border:3px solid transparent;background:var(--surf)}
.col.on{border-color:var(--tx)}
.col.c1{background:#FFF3C4}.col.c2{background:#DDF2EC}.col.c3{background:#E3EAFD}.col.c4{background:#FBE5D8}
.ck{display:flex;align-items:center;gap:8px;min-height:50px;border-radius:16px;background:var(--surf);padding:0 6px 0 4px}
.ck button.bx{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.ck input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:16px;height:44px}
.ck.done input{text-decoration:line-through;opacity:.6}
.th{width:100%;border-radius:24px;padding:14px;display:flex;align-items:center;gap:14px;background:var(--surf);border:3px solid transparent}
.th.on{border-color:var(--acc)}
.th .pv{width:74px;height:74px;border-radius:18px;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:9px;flex:none}
.th .pv i{border-radius:7px;display:block}
.th b{font-size:16px;font-weight:800;display:block}
.th span{font-size:13px;color:var(--sub)}
.imgv{position:fixed;inset:0;background:#000;z-index:15;display:flex;align-items:center;justify-content:center;animation:fade .2s both}
.imgv img{max-width:100%;max-height:100%}
.imgv button{position:absolute;left:16px;top:16px;width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.16);color:#FFFFFF;display:flex;align-items:center;justify-content:center}
@keyframes scanl{0%,100%{top:8%}50%{top:88%}}
.camw{position:relative;border-radius:28px;overflow:hidden;background:#000;aspect-ratio:1/1}
.camw video{width:100%;height:100%;object-fit:cover;display:block}
.camw .frame{position:absolute;inset:16%;border:3px solid #FFD23F;border-radius:24px;box-shadow:0 0 0 2000px rgba(0,0,0,.4)}
.camw .frame i{position:absolute;left:6%;right:6%;height:3px;border-radius:2px;background:#FFD23F;animation:scanl 2.4s ease-in-out infinite}
.camw .cmsg{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#FFFFFF;font-size:13px;font-weight:600;padding:0 16px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.two .btn{width:100%}
.qt{min-height:110px;border-radius:18px;border:0;background:var(--surf);padding:14px 16px;font-size:16px;line-height:22px;outline:0;width:100%;resize:none}
.qrc{border-radius:24px;background:#FFFFFF;padding:18px;display:flex;align-items:center;justify-content:center;min-height:120px;color:#5B616E;font-size:14px}
.qrc canvas{width:230px;height:230px;image-rendering:pixelated}
.rtx{border-radius:16px;background:var(--surf);padding:14px;font-size:15px;line-height:21px;word-break:break-word;-webkit-user-select:text;user-select:text;max-height:180px;overflow-y:auto}
.pg{position:relative;width:100%;aspect-ratio:3/4;border-radius:20px;overflow:hidden;background:var(--surf);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-size:13px;font-weight:700}
.pg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pg em{position:absolute;left:10px;top:10px;font-style:normal;min-width:28px;height:28px;border-radius:10px;background:#14161A;color:#FFFFFF;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 8px}
.f-doc{filter:grayscale(1) contrast(1.6) brightness(1.1)}

  if (qrDet) {
    qrBusy = true;
    qrDet.detect(v).then(function (r) { qrBusy = false; if (!qrStream) return; if (r && r.length && r[0].rawValue) qrFound(r[0].rawValue); else if (qrN % 3 === 0) qrNative(v); }).catch(function () { qrDet = null; qrBusy = false; });
  } else qrNative(v);
}
function qrFound(text) {
  qrStop(); try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
  cfg.qrh = cfg.qrh.filter(function (x) { return x.x !== text; }); cfg.qrh.unshift({ x: text, m: Date.now() }); cfg.qrh = cfg.qrh.slice(0, 30); saveJ('cfg', cfg);
  qrResult(text);
}
function qrResult(text) {
  qrLast = text; var url = /^https?:\/\//i.test(text);
  var it = [['qrCopy', 'copy', 'Nusxalash']]; if (url) it.push(['qrOpen', 'open', 'Havolani ochish']); it.push(['qrSh', 'share', 'Ulashish'], ['qrNote', 'note', 'Zametkaga saqlash']);
  openOv('<div class="sh" role="dialog" aria-label="QR natijasi"><div class="grab"></div><h3>QR kod o\'qildi</h3><div class="rtx">' + esc(text) + '</div>' + it.map(function (x) { return '<button class="it" data-a="' + x[0] + '">' + ic(x[1]) + x[2] + '</button>'; }).join('') + '</div>');
  afterOv = function () { var s = tp(); if (s.t === 'qr' && (s.m || 'scan') === 'scan') render(''); };
}
function qrDraw() {
  var s = tp(), box = $('#qrc'); if (!box) return; var t = (s.text || '').trim();
  if (!t) { box.textContent = 'Matn yozing, QR kod shu yerda chiqadi'; return; }
  var r; try { r = JSON.parse(N.qr(t)); } catch (e) { r = null; }
  if (!r || !r.n) { box.textContent = 'Matn juda uzun, qisqartiring'; return; }
  var q = 4, cell = Math.max(4, Math.floor(720 / (r.n + q * 2))), c = document.createElement('canvas'); c.id = 'qcan'; c.width = c.height = cell * (r.n + q * 2);
  var x = c.getContext('2d'); x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#000000';
  for (var i = 0; i < r.n * r.n; i++) if (r.d.charAt(i) === '1') x.fillRect((q + i % r.n) * cell, (q + Math.floor(i / r.n)) * cell, cell, cell);
  box.textContent = ''; box.appendChild(c);
}
function qrSaveFile() { var c = $('#qcan'); if (!c) { toast('Avval matn yozing'); return ''; } var p = N.savePng('QR_' + stamp(), c.toDataURL('image/png')); if (!p) toast('Saqlab bo\'lmadi. Fayllarga ruxsat berilganmi?'); return p; }
window.onPhoto = function (tag, path) {
  if (!path) return;
  if (tag === 'qr') { var r = N.decodeFile(path); if (r) qrFound(r); else toast('Bu suratda kod topilmadi'); }
  else if (tag === 'scan') { var d = N.photoData(path, 1800); if (!d) { toast('Surat ochilmadi'); return; } scanPages.push({ src: d, flt: 'doc', crop: [0, 0, 1, 1] }); if (tp().t === 'scan') { tp().edit = null; render(''); } toast(scanPages.length + '-sahifa qo\'shildi'); }
};

/* ---------- Skaner ---------- */
var FLT = [['asl', 'Asl'], ['doc', 'Hujjat'], ['bw', 'Oq-qora']];
var FCSS = { asl: 'none', doc: 'grayscale(1) contrast(1.6) brightness(1.1)', bw: 'grayscale(1) contrast(4) brightness(1.25)' };
function vScan(s) {
  if (s.edit != null && scanPages[s.edit]) return vScanEdit(s, scanPages[s.edit]);
  s.edit = null;
  var h = '<div class="hd"><button class="ib press" data-a="back" aria-label="Orqaga">' + ic('back') + '</button><div class="tt"><span class="sm">' + (scanPages.length ? scanPages.length + ' ta sahifa' : 'Suratdan PDF') + '</span><h1 class="s">Skaner</h1></div></div>';
  if (!scanPages.length) h += '<div class="empty">' + ic('scan', 34) + '<span>Hujjatni suratga oling. Har bir surat bitta sahifa bo\'ladi, keyin hammasi bitta PDF qilib saqlanadi.</span></div>';
  else h += '<div class="grid">' + scanPages.map(function (p, i) { return '<button class="pg press" data-a="spEdit" data-i="' + i + '" aria-label="' + (i + 1) + '-sahifa"><img alt="" class="f-' + p.flt + '" src="' + p.src + '"><em>' + (i + 1) + '</em></button>'; }).join('') + '</div>';
  h += '<div class="two"><button class="btn press" data-a="scanCam">' + ic('plus', 20) + 'Suratga olish</button><button class="btn g press" data-a="scanPick">Galereyadan</button></div>';
  if (scanPages.length) h += '<button class="btn press" data-a="scanPdf" style="background:var(--calc);color:#FFFFFF">' + ic('doc', 20) + 'PDF qilib saqlash</button>';
  return h;
}
function vScanEdit(s, p) {
  var h = '<div class="hd"><button class="ib press" data-a="spDone" aria-label="Orqaga">' + ic('back') + '</button><div class="tt"><span class="sm">Burchaklarni surib keraksiz joyni kesing</span><h1 class="s">' + (s.edit + 1) + '-sahifa</h1></div></div>';
  h += '<div class="cropw" id="cropw"><img id="cimg" alt="" class="f-' + p.flt + '" src="' + p.src + '"><div id="cbox"><i class="h" data-h="0"></i><i class="h" data-h="1"></i><i class="h" data-h="2"></i><i class="h" data-h="3"></i></div></div>';
  h += '<div class="chs">' + FLT.map(function (f) { return '<button class="ch f' + (p.flt === f[0] ? ' on' : '') + '" data-a="spFlt" data-v="' + f[0] + '">' + f[1] + '</button>'; }).join('') + '</div>';
  h += '<div class="two"><button class="btn g press" data-a="spRot">90° burish</button><button class="btn g press" data-a="spDel" style="color:var(--red)">O\'chirish</button></div><button class="btn press" data-a="spDone">Tayyor</button>';
  return h;
}
function cropPaint() {
  var s = tp(), p = scanPages[s.edit], b = $('#cbox'); if (!p || !b) return; var c = p.crop;
  b.style.left = c[0] * 100 + '%'; b.style.top = c[1] * 100 + '%'; b.style.width = (c[2] - c[0]) * 100 + '%'; b.style.height = (c[3] - c[1]) * 100 + '%';
  var hs = b.querySelectorAll('.h'), pos = [[0, 0], [100, 0], [0, 100], [100, 100]];
  for (var i = 0; i < 4; i++) { hs[i].style.left = pos[i][0] + '%'; hs[i].style.top = pos[i][1] + '%'; }
}
var dragH = -1;
document.addEventListener('pointerdown', function (e) { var h = e.target.closest ? e.target.closest('.h') : null; if (h) { dragH = +h.dataset.h; e.preventDefault(); } });
document.addEventListener('pointermove', function (e) {
  if (dragH < 0) return; var s = tp(), p = scanPages[s.edit], im = $('#cimg'); if (!p || !im) { dragH = -1; return; }
  var r = im.getBoundingClientRect(), x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)), c = p.crop, m = 0.12;
  if (dragH === 0 || dragH === 2) c[0] = Math.min(x, c[2] - m); else c[2] = Math.max(x, c[0] + m);
  if (dragH === 0 || dragH === 1) c[1] = Math.min(y, c[3] - m); else c[3] = Math.max(y, c[1] + m);
  cropPaint(); e.preventDefault();
});
document.addEventListener('pointerup', function () { dragH = -1; });
document.addEventListener('pointercancel', function () { dragH = -1; });
function loadImg(src, cb) { var im = new Image(); im.onload = function () { cb(im); }; im.onerror = function () { cb(null); }; im.src = src; }
function pageOut(p, max, cb) {
  loadImg(p.src, function (im) {
    if (!im) { cb(''); return; }
    var c = p.crop, sx = Math.round(c[0] * im.width), sy = Math.round(c[1] * im.height), sw = Math.max(1, Math.round((c[2] - c[0]) * im.width)), sh = Math.max(1, Math.round((c[3] - c[1]) * im.height));
    var k = Math.min(1, max / Math.max(sw, sh)), cv = document.createElement('canvas'); cv.width = Math.round(sw * k); cv.height = Math.round(sh * k);
    var x = cv.getContext('2d'); x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, cv.width, cv.height); try { x.filter = FCSS[p.flt] || 'none'; } catch (e) {}
    x.drawImage(im, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
    cb(cv.toDataURL('image/jpeg', 0.82));
  });
}
function scanMakePdf(name) {
  busy('PDF tayyorlanmoqda...');
  setTimeout(function () {
    N.pdfBegin(); var i = 0, bad = 0;
    (function next() {
      if (i >= scanPages.length) {
        var path = N.pdfEnd(name); closeOv();
        if (!path) { toast('PDF saqlanmadi. Fayllarga ruxsat berilganmi?'); return; }
        lastPdf = path; scanPages = []; render('');
        sheet('PDF saqlandi: ' + path.split('/').pop(), [['pdfOpen', 'open', 'Ochish'], ['pdfShare', 'share', 'Ulashish'], ['pdfDir', 'folder', 'Papkani ko\'rish']]);
        if (bad) toast(bad + ' ta sahifa qo\'shilmadi');
        return;
      }
      pageOut(scanPages[i], 1500, function (d) { if (!d || !N.pdfPage(d)) bad++; i++; setTimeout(next, 10); });
    })();
  }, 60);
}

/* ---------- Amallar ---------- */
var selItem = null;
var A = {
  tabHome: function () { home(); }, tabNotes: function () { home('notes'); }, tabCalc: function () { home('calc'); }, tabSet: function () { home('set'); },

  perm: function () { N.askPerm(); },

  plus: function () { var s = tp(), it = []; if (s.t === 'dir' && s.ok) it.push(['newDir', 'folder', 'Yangi papka']); it.push(['newNote', 'note', 'Yangi zametka'], ['newList', 'list', 'Yangi ro\'yxat']); sheet('Yaratish', it); },
  ovX: function () { closeOv(); },

  mkThis: function () { var s = tp(), i = s.path.lastIndexOf('/'); if (N.mkdir(s.path.slice(0, i), s.path.slice(i + 1))) { loadDir(s); render(''); } else toast('Papka yaratilmadi'); },
  sort: function () { var k = cfg.sort || 'n', i = 0; for (var j = 0; j < SORTS.length; j++) if (SORTS[j][0] === k) i = j; i = (i + 1) % SORTS.length; cfg.sort = SORTS[i][0]; saveJ('cfg', cfg); reloadDir(); toast(SORTS[i][1]); },
  moreItems: function () { cur.lim += 200; $('#dirBody').innerHTML = dirBody(cur); },
  item: function (el) { var x = cur.shown[+el.dataset.i]; if (x) openItem(x); },
  menu: function (el) { var x = cur.shown[+el.dataset.i]; if (!x) return; selItem = x; var it = [['mOpen', 'open', x.d ? 'Ochish' : 'Boshqa dasturda ochish'], ['mRen', 'edit', 'Nomini o\'zgartirish'], ['mCopy', 'copy', 'Nusxalash'], ['mMove', 'move', 'Ko\'chirish']]; if (!x.d) it.push(['mShare', 'share', 'Ulashish']); it.push(['mDel', 'trash', 'O\'chirish', 1]); sheet(x.n, it); },
  mOpen: function () { closeOv(); if (selItem.d) openItem(selItem); else N.open(cur.path + '/' + selItem.n); },
  mShare: function () { closeOv(); N.share(cur.path + '/' + selItem.n); },
  mRen: function () { var x = selItem; closeOv(); ask('Nomini o\'zgartirish', x.n, 'Saqlash', function (v) { var e = badNameMsg(v); if (e) { toast(e); return; } if (v === x.n) return; if (N.rename(cur.path + '/' + x.n, v)) { reloadDir(); toast('Nomi o\'zgartirildi'); } else toast('O\'zgartirilmadi: bunday nom bor'); }); },
  mCopy: function () { clip = { path: cur.path + '/' + selItem.n, name: selItem.n, move: false }; closeOv(); render(''); toast('Kerakli papkani oching va «Shu yerga qo\'yish»ni bosing'); },
  mMove: function () { clip = { path: cur.path + '/' + selItem.n, name: selItem.n, move: true }; closeOv(); render(''); toast('Kerakli papkani oching va «Shu yerga ko\'chirish»ni bosing'); },
  clipX: function () { clip = null; render(''); },
  clipGo: function () { var c = clip; clip = null; busy(c.move ? 'Ko\'chirilmoqda...' : 'Nusxalanmoqda...'); op(function (id) { N.paste(id, c.path, cur.path, c.move); }, function (ok) { closeOv(); if (tp().t === 'dir') { loadDir(tp()); render(''); } toast(ok ? (c.move ? 'Ko\'chirildi' : 'Nusxalandi') : 'Bajarilmadi'); }); },
  mDel: function () { var x = selItem; closeOv(); confirmDlg('O\'chirilsinmi?', '«' + x.n + '»' + (x.d ? ' papkasi ichidagi hamma narsa bilan' : '') + ' butunlay o\'chiriladi. Buni qaytarib bo\'lmaydi.', 'O\'chirish', function () { busy('O\'chirilmoqda...'); op(function (id) { N.remove(id, cur.path + '/' + x.n); }, function (ok) { closeOv(); reloadDir(); toast(ok ? 'O\'chirildi' : 'O\'chirib bo\'lmadi'); }); }); },
  imgX: function () { closeImg(); },
  cMode: function (el) { var c = cfg.calc; if (c.mode === el.dataset.v) return; var r = calcCompute(c); c.mode = el.dataset.v; if (r.ok) c.val = c.mode === 'I' ? num(r.p, 2) : num(r.i, 1); saveJ('cfg', cfg); swapCalc(); },
  cU: function (el) { cfg.calc.u = +el.dataset.v; saveJ('cfg', cfg); swapCalc(); },
  cCos: function (el) { cfg.calc.cos = +el.dataset.v; saveJ('cfg', cfg); swapCalc(); },
  note: function (el) { go({ t: 'note', id: el.dataset.id }); },
  nf: function (el) { tp().f = +el.dataset.v; render(''); },
  nPin: function () { var n = findNote(tp().id); n.pin = !n.pin; saveJ('notes', notes); render(''); toast(n.pin ? 'Qadaldi' : 'Qadash olib tashlandi'); },
  nCol: function (el) { var n = findNote(tp().id); n.col = +el.dataset.v; saveJ('notes', notes); var all = document.querySelectorAll('.col'); for (var i = 0; i < all.length; i++) all[i].classList.toggle('on', +all[i].dataset.v === n.col); },
  nMenu: function () { sheet('Zametka', [['nShare', 'share', 'Ulashish'], ['nDel', 'trash', 'O\'chirish', 1]]); },
  nShare: function () { var n = findNote(tp().id); closeOv(); N.shareText(n.t || 'Zametka', (n.t ? n.t + '\n\n' : '') + (n.items ? n.items.map(function (x) { return (x.done ? '[x] ' : '[ ] ') + x.x; }).join('\n') : n.b)); },
  nDel: function () { closeOv(); confirmDlg('Zametka o\'chirilsinmi?', 'Bu zametka butunlay o\'chiriladi.', 'O\'chirish', function () { var id = tp().id; clearTimeout(noteT); notes = notes.filter(function (x) { return String(x.id) !== String(id); }); saveJ('notes', notes); stack.pop(); render('back'); toast('O\'chirildi'); }); },
  ckT: function (el) { var n = findNote(tp().id), x = n.items[+el.dataset.i]; x.done = !x.done; touchNote(); rerenderCks(); },
  ckDel: function (el) { var n = findNote(tp().id); n.items.splice(+el.dataset.i, 1); touchNote(); rerenderCks(); },
  ckAdd: function () { var n = findNote(tp().id); n.items.push({ x: '', done: false }); touchNote(); rerenderCks(); var ins = document.querySelectorAll('#cks input'); if (ins.length) ins[ins.length - 1].focus(); },
  toQr: function () { go({ t: 'qr' }); },
  toScan: function () { go({ t: 'scan' }); },

  qrPick: function () { qrStop(); N.pick('qr'); },

  qrClear: function () { cfg.qrh = []; saveJ('cfg', cfg); render(''); },

  qrOpen: function () { N.openUrl(qrLast); closeOv(); },

  qrNote: function () { notes.push({ id: Date.now(), t: 'QR kod', b: qrLast, items: null, pin: false, col: 3, m: Date.now() }); saveJ('notes', notes); closeOv(); toast('Zametkaga saqlandi'); },
  qrSave: function () { var p = qrSaveFile(); if (p) toast('Saqlandi: Pictures/Chaqmoq'); },
  qrShare: function () { var p = qrSaveFile(); if (p) N.share(p); },
  scanCam: function () { N.cam('scan'); },
  scanPick: function () { N.pick('scan'); },
  scanPdf: function () { ask('PDF nomi', 'Skan_' + stamp(), 'Saqlash', function (v) { if (!v) { toast('Nom bo\'sh bo\'lmasin'); return; } scanMakePdf(v); }); },
  spEdit: function (el) { tp().edit = +el.dataset.i; render('fwd'); },
  spDone: function () { tp().edit = null; render('back'); },
  spFlt: function (el) { var p = scanPages[tp().edit]; p.flt = el.dataset.v; render(''); },
  spDel: function () { scanPages.splice(tp().edit, 1); tp().edit = null; render('back'); toast('Sahifa o\'chirildi'); },
  spRot: function () { var s = tp(), p = scanPages[s.edit]; loadImg(p.src, function (im) { if (!im) return; var c = document.createElement('canvas'); c.width = im.height; c.height = im.width; var x = c.getContext('2d'); x.translate(c.width / 2, c.height / 2); x.rotate(Math.PI / 2); x.drawImage(im, -im.width / 2, -im.height / 2); p.src = c.toDataURL('image/jpeg', 0.9); p.crop = [0, 0, 1, 1]; render(''); }); },
  pdfOpen: function () { closeOv(); N.open(lastPdf); },
  pdfShare: function () { closeOv(); N.share(lastPdf); },

};
function swapCalc() { var e = document.querySelector('.calc'); if (e) { e.outerHTML = calcCard(); calcUpdate(); } }

document.addEventListener('click', function (e) {
  if (e.target.id === 'ov') { if (!dlgCb && !ovLock) closeOv(); return; }
  var el = e.target.closest('[data-a]'); if (!el) return;
  var f = A[el.dataset.a]; if (f) { e.stopPropagation(); f(el); }
});
document.addEventListener('contextmenu', function (e) { var el = e.target.closest('[data-a="item"]'); if (el) { e.preventDefault(); A.menu(el); } });
document.addEventListener('input', function (e) {
  var t = e.target, s = tp();
  if (t.id === 'cval') { cfg.calc.val = t.value; calcUpdate(); clearTimeout(calcT); calcT = setTimeout(function () { saveJ('cfg', cfg); }, 600); }
  else if (t.id === 'qtext') { s.text = t.value; clearTimeout(calcT); calcT = setTimeout(qrDraw, 250); }
  else if (t.id === 'q') { s.q = t.value; s.lim = 120; $('#dirBody').innerHTML = dirBody(s); }

  else if (t.dataset.ck !== undefined) { var n3 = findNote(s.id); if (n3 && n3.items[+t.dataset.ck]) { n3.items[+t.dataset.ck].x = t.value; touchNote(); } }
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return; var t = e.target;
  if (t.id === 'dval' && dlgCb) { e.preventDefault(); dlgCb(); }

});
document.addEventListener('focusin', function (e) { var t = e.target; if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') $('#nav').classList.add('hide'); });

window.addEventListener('pagehide', function () { if (tp().t === 'note') { clearTimeout(noteT); saveJ('notes', notes); } });

refreshInfo(); applyTheme(); render('');
