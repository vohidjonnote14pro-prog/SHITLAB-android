name: ShitLab Flutter APK

on:
  push:
    branches: [ flutter ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter versiyasi
        run: flutter --version

      - name: Android qismini yaratish
        run: |
          flutter create --project-name shitlab --org uz.shitlab --platforms android .
          rm -rf test

      - name: Ilova nomi va ikonka
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="shitlab"/android:label="ShitLab"/' $M
          # Internet (Telegram) ruxsati
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          # Havolalarni ochish uchun (Android 11+)
          sed -i 's#<queries>#<queries>\n        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>#' $M
          grep -n "INTERNET\|label\|scheme" $M
          cp -r branding/android-res/* android/app/src/main/res/

      - name: Kutubxonalar
        run: flutter pub get

      - name: Kodni tekshirish
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          grep -E "^\s*error " analyze.txt | head -40 | while IFS= read -r line; do
            echo "::error title=analyze::$line"
          done
          exit $code

      - name: APK yig'ish
        run: |
          set +e
          flutter build apk --release --split-per-abi > build.txt 2>&1
          code=$?
          cat build.txt
          if [ $code -ne 0 ]; then
            grep -iE "error|exception|failed|what went wrong" build.txt | head -40 | while IFS= read -r line; do
              echo "::error title=build::$line"
            done
          fi
          exit $code

      - name: Nomlash
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ShitLab.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ShitLab-eski-telefonlar.apk
          ls -lh *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShitLab-flutter-apk
          path: |
            ShitLab.apk
            ShitLab-eski-telefonlar.apk

      - name: Release yaratish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v5.${{ github.run_number }}" ShitLab.apk ShitLab-eski-telefonlar.apk \
            --target "${{ github.sha }}" \
            --title "ShitLab v5.${{ github.run_number }} (Flutter)" \
            --notes "Haqiqiy Flutter ilova. ShitLab.apk ni yuklab oling va o'rnating (noma'lum manbalarga ruxsat bering). O'rnatilmasa (juda eski telefon), ShitLab-eski-telefonlar.apk ni oling. 3-bosqich: hisob-kitob va materiallar PDF, QR montaj (rasmlar Telegram kanalga), montaj pasporti va sxema PDF."
