name: ShitLab Flutter APK

on:
  push:
    branches: [ flutter ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter versiyasi
        run: flutter --version

      - name: Android qismini yaratish
        run: |
          flutter create --project-name shitlab --org uz.shitlab --platforms android .
          rm -rf test

      - name: Ilova nomi va ikonka
        run: |
          sed -i 's/android:label="shitlab"/android:label="ShitLab"/' android/app/src/main/AndroidManifest.xml
          cp -r branding/android-res/* android/app/src/main/res/

      - name: Kutubxonalar
        run: flutter pub get

      - name: Kodni tekshirish
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: APK yig'ish
        run: flutter build apk --release

      - name: Nomlash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ShitLab.apk
          ls -lh ShitLab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShitLab-flutter-apk
          path: ShitLab.apk

      - name: Release yaratish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v5.${{ github.run_number }}" ShitLab.apk \
            --target "${{ github.sha }}" \
            --title "ShitLab v5.${{ github.run_number }} (Flutter, 1-bosqich)" \
            --notes "Haqiqiy Flutter ilova. Telefonga yuklab oling va o'rnating (noma'lum manbalarga ruxsat bering). 1-bosqich: kirish ekrani, loyihalar, yangi shit, yuklama hisobi (PUE), bir chiziqli sxema, telefonga saqlash."
