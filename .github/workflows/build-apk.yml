name: APK yig'ish

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK yig'ish
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Nomlash
        run: cp app/build/outputs/apk/release/app-release.apk ShitLab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShitLab-apk
          path: ShitLab.apk

      - name: Release yaratish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" ShitLab.apk \
            --title "ShitLab v1.${{ github.run_number }}" \
            --notes "Telefonga yuklab oling va o'rnating (noma'lum manbalarga ruxsat bering)."
